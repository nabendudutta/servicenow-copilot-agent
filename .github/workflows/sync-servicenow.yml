name: ServiceNow Data Sync

on:
  schedule:
    # Runs 3x daily: 06:00, 14:00, 22:00 UTC
    #- cron: "0 6 * * *"
    #- cron: "0 14 * * *"
    #- cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      sync_type:
        description: "Type of sync to run"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - incidents
          - changes
          - problems
          - knowledge

permissions:
  contents: write

jobs:
  sync-servicenow:
    name: Sync ServiceNow → Markdown DB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run ServiceNow Sync
        env:
          SERVICENOW_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE }}
          SERVICENOW_USERNAME: ${{ secrets.SERVICENOW_USERNAME }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
          SERVICENOW_CLIENT_ID: ${{ secrets.SERVICENOW_CLIENT_ID }}
          SERVICENOW_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
          SYNC_TYPE: ${{ github.event.inputs.sync_type || 'full' }}
          SYNC_LOOKBACK_HOURS: "8"
          MAX_RECORDS_PER_TABLE: "500"
        run: |
          python scripts/sync_servicenow.py

      - name: Rebuild Search Index
        run: |
          python scripts/build_index.py

      - name: Commit & Push database updates
        run: |
          git config user.name  "ServiceNow Copilot Bot"
          git config user.email "servicenow-copilot[bot]@users.noreply.github.com"

          git add database/
          
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "✅ No changes to commit — database is already up to date."
          else
            SYNC_TIME=$(date -u '+%Y-%m-%d %H:%M UTC')
            CHANGED=$(git diff --cached --name-only | wc -l)
            git commit -m "🔄 ServiceNow sync: ${CHANGED} files updated [${SYNC_TIME}]"
            git push
            echo "✅ Pushed ${CHANGED} updated files."
          fi

      - name: Post sync summary
        if: always()
        run: |
          echo "### 📊 Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Table | Files |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Incidents | $(ls database/incidents/*.md 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Changes   | $(ls database/changes/*.md   2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Problems  | $(ls database/problems/*.md  2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Knowledge | $(ls database/knowledge/*.md 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕐 **Last sync:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
